<!DOCTYPE html>
<html>
  <head>
    <title>GT Accessibility Map Prototype</title>
    <style>
      #map {
        height: 100vh;
        width: 100%;
      }
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      // 1. Hard-coded mock data centered around Georgia Tech campus
      const issues = [
        { id: 1, type: "Blocked Ramp", lat: 33.7756, lng: -84.3963, desc: "Construction equipment blocking sidewalk ramp near Tech Tower." },
        { id: 2, type: "Broken Elevator", lat: 33.7765, lng: -84.3981, desc: "Student Center elevator out of order." },
        { id: 3, type: "Missing Curb Cut", lat: 33.7780, lng: -84.3970, desc: "No curb cut at crosswalk." },
        { id: 4, type: "Automatic Door Failure", lat: 33.7742, lng: -84.3955, desc: "Push-button entry door not responding." },
        { id: 5, type: "Steep Slope Warning", lat: 33.7771, lng: -84.4010, desc: "Excessive grade near West Campus housing." },
        { id: 6, type: "Uneven Pavement", lat: 33.7738, lng: -84.3988, desc: "Tree roots lifting concrete." }
      ];

      function initMap() {
        // 2. Center map on Georgia Tech campus coordinates
        const gaTechCampus = { lat: 33.7756, lng: -84.3963 };
        
        const map = new google.maps.Map(document.getElementById("map"), {
          zoom: 16,
          center: gaTechCampus,
        });

        const infoWindow = new google.maps.InfoWindow();

        // 3. Loop through hard-coded issues and drop markers
        issues.forEach((issue) => {
          const marker = new google.maps.Marker({
            position: { lat: issue.lat, lng: issue.lng },
            map: map,
            title: issue.type,
          });

          // Open an InfoWindow when clicking a marker
          marker.addListener("click", () => {
            infoWindow.setContent(`
              <div style="font-family: sans-serif; padding: 4px;">
                <h3 style="margin: 0 0 4px 0;">${issue.type}</h3>
                <p style="margin: 0;">${issue.desc}</p>
              </div>
            `);
            infoWindow.open(map, marker);
          });
        });
      }
    </script>

    <!-- 4. Google Maps JS API script -->
<script
src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBLsAXmkL_jNvSm5VNsSgISZqILD_0eDC0&loading=async&callback=initMap"
async
defer
></script>
